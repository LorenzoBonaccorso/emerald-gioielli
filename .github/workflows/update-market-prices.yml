name: Aggiorna quotazioni e pubblica sito

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Scarica il repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepara Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Esegui i controlli automatici
        run: npm test && npm run check

  build-and-deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepara Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Aggiorna il cambio USD/EUR
        env:
          TICKBASE_API_KEY: ${{ secrets.TICKBASE_API_KEY }}
        run: node scripts/update-market-prices.mjs

      - name: Prepara i file pubblici
        run: |
          mkdir -p dist
          cp index.html script.js pricing.mjs style.css sitemap.xml robots.txt dist/
          mkdir -p dist/images
          cp images/favicon.jpg images/logo-navbar.jpg dist/images/
          cp -R data dist/
          if [ -f CNAME ]; then cp CNAME dist/; fi
          touch dist/.nojekyll

      - name: Configura GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Carica il sito
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist

      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
