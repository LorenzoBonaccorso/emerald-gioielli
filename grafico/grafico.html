<head>

  <meta charset="utf-8" />

  <title>Emerald Gioielli - Prezzo Acquisto Oro 18K</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page simple-page">
    <a class="back-home" href="../index.html">← Torna a Emerald Gioielli</a>
    <section class="price-card-simple">
      <div class="brand simple-brand">
        <div class="coin">Au</div>
        <div>
          <p class="eyebrow">Prezzo acquisto indicativo</p>
          <h1>Oro 18K</h1>
          <div class="price-row"><span id="lastPrice" class="price">-- €</span><small> /g</small></div>
        </div>
      </div>

      <div class="simple-info">
        <span id="liveStatus" class="status">Aggiornamento automatico ogni 60 secondi.</span>
        <span id="lastUpdate" class="status">--:--:--</span>
      </div>

      <div class="simple-converter">
        <label for="gold-grams">Inserisci grammi</label>
        <div class="converter-row">
          <input id="gold-grams" type="number" min="0" step="0.01" value="1" inputmode="decimal" />
          <span class="unit-pill">g</span>
        </div>
        <div class="converter-result">
          <span>Valore indicativo</span>
          <strong id="gold-total">-- €</strong>
        </div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
