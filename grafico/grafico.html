<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emerald Gioielli - Quotazione Oro Live</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <a class="back-home" href="../index.html">← Torna a Emerald Gioielli</a>
    <header class="top">
      <div class="brand">
        <div class="coin">Au</div>
        <div>
          <p class="eyebrow">Quotazione oro</p>
          <h1 id="title">Oro Prezzo in EUR per Grammo</h1>
          <div class="price-row"><span id="lastPrice" class="price">-- €</span></div>
        </div>
      </div>

      <div class="stats">
        <span id="change" class="change">--</span>
        <span id="high">Alto: --</span>
        <span id="low">Basso: --</span>
      </div>
    </header>

    <section class="controls">
      <div class="buttons" id="periodButtons">
        <button data-key="oggi">Oggi</button>
        <button data-key="settimana">Settimana</button>
        <button data-key="mese">Mese</button>
        <button data-key="tre_mesi">3 mesi</button>
        <button data-key="sei_mesi">6 mesi</button>
        <button data-key="anno">Anno</button>
      </div>

      <div class="live-actions">
        <button id="btnUpdateNow">Aggiorna ora</button>
        <button id="btnAuto" class="ghost">Auto: OFF</button>
        <select id="intervalMin" title="Intervallo aggiornamento">
          <option value="1">1 min</option>
          <option value="5" selected>5 min</option>
          <option value="15">15 min</option>
          <option value="30">30 min</option>
          <option value="60">60 min</option>
        </select>
        <button id="btnExport" class="gold">Scarica JSON</button>
        <button id="btnResetLocal" class="danger">Reset</button>
      </div>
    </section>

    <section class="chart-card">
      <canvas id="chart" width="1200" height="470"></canvas>
      <canvas id="miniChart" width="1200" height="58"></canvas>
    </section>

    <div id="liveStatus" class="status">Dati caricati. Gli aggiornamenti live sono salvati nel browser; scarica il JSON quando vuoi esportarli.</div>
  </main>
  <script src="app.js"></script>
</body>
</html>
